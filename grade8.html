<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصف الثامن - منصة الأستاذ طه</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header>
    <h1 id="pageTitle">الصف الثامن</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="admin.html">لوحة التحكم</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌓 النمط</button>
    </nav>
  </header>

  <div class="container" id="contentContainer">
    <p>جاري تحميل محتوى الوحدات والدروس...</p>
  </div>

  <footer>
    <p>منصة الأستاذ طه للرياضيات</p>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    const targetGradeId = "grade8";

    function initPage(data) {
      const grade = data.grades.find(g => g.id === targetGradeId);
      if (!grade) {
        document.getElementById("contentContainer").innerHTML = "<h2>عذراً، لا توجد بيانات لهذا الصف حالياً.</h2>";
        return;
      }

      document.getElementById("pageTitle").innerText = grade.name;
      let html = "";

      if (!grade.units || grade.units.length === 0) {
        document.getElementById("contentContainer").innerHTML = "<h2>لم يتم إضافة وحدات دراسية لهذا الصف بعد. استخدم لوحة التحكم لإضافة وحدات ودروس.</h2>";
        return;
      }

      grade.units.forEach(unit => {
        html += '<div style="margin-bottom: 2.5rem;">';
        html += '<h2 style="border-bottom: 2px solid var(--primary-color); padding-bottom: 0.5rem; margin-bottom: 1rem; color: var(--primary-color);">' + unit.name + '</h2>';
        
        if (!unit.lessons || unit.lessons.length === 0) {
          html += '<p style="color: #64748b; margin-bottom: 1rem;">لا توجد دروس مضافة في هذه الوحدة حالياً.</p>';
        } else {
          html += '<div class="grid">';
          unit.lessons.forEach(lesson => {
            html += '<div class="card">';
            html += '<h3>' + lesson.title + '</h3>';
            html += '<p>' + (lesson.explanation ? lesson.explanation.substring(0, 100) : '') + '...</p>';
            html += '<a href="lesson.html?grade=' + grade.id + '&unit=' + unit.id + '&lesson=' + lesson.id + '" class="btn">دخول الدرس</a>';
            html += '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });

      document.getElementById("contentContainer").innerHTML = html;
      renderMath();
    }
  </script>
</body>
</html>
