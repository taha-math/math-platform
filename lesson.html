<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض الدرس - منصة الأستاذ طه</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header>
    <h1 id="lessonTitle">عنوان الدرس</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌓 النمط</button>
    </nav>
  </header>

  <div class="container" id="lessonContainer">
    <p>جاري تحميل الدرس...</p>
  </div>

  <footer>
    <p>منصة الأستاذ طه للرياضيات</p>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    function initPage(data) {
      const params = new URLSearchParams(window.location.search);
      const gradeId = params.get("grade");
      const unitId = params.get("unit");
      const lessonId = params.get("lesson");

      const grade = data.grades.find(g => g.id === gradeId);
      const unit = grade ? grade.units.find(u => u.id === unitId) : null;
      const lesson = unit ? unit.lessons.find(l => l.id === lessonId) : null;

      if (!lesson) {
        document.getElementById("lessonContainer").innerHTML = "<h2>عذراً، الدرس غير موجود.</h2>";
        return;
      }

      document.getElementById("lessonTitle").innerText = lesson.title;
      
      let html = `
        <div class="card" style="margin-bottom: 1.5rem;">
          <h3 style="color:var(--primary-color)">الشرح والتوضيح</h3>
          <p style="white-space: pre-line;">${lesson.explanation}</p>
        </div>
        <div class="card" style="margin-bottom: 1.5rem;">
          <h3 style="color:var(--primary-color)">الأمثلة المحلولة</h3>
          <p style="white-space: pre-line;">${lesson.examples}</p>
        </div>
        <div class="card" style="margin-bottom: 1.5rem;">
          <h3 style="color:var(--primary-color)">التمارين والتدريبات</h3>
          <p style="white-space: pre-line;">${lesson.exercises}</p>
        </div>
        <div class="card" style="margin-bottom: 1.5rem;">
          <h3 style="color:var(--primary-color)">الحلول النموذجية</h3>
          <p style="white-space: pre-line;">${lesson.solutions}</p>
        </div>
        <div class="card">
          <h3 style="color:var(--primary-color)">ملاحظات وإرشادات معلم</h3>
          <p style="white-space: pre-line;">${lesson.notes || ""}</p>
        </div>
      `;

      document.getElementById("lessonContainer").innerHTML = html;
      renderMath();
    }
  </script>
</body>
</html>
