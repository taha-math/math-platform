<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة الأستاذ طه للرياضيات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Mammoth.js for Word .docx conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-cogs ml-2"></i> لوحة تحكم منصة الأستاذ طه</h1>
            <a href="index.html" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded text-sm transition"><i class="fas fa-home ml-1"></i> العودة للمنصة</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        
        <!-- Success Alert -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-lg bg-green-100 text-green-700 border border-green-300 font-medium"></div>

        <!-- Add/Edit Lesson Card -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 id="formTitle" class="text-lg font-bold text-indigo-700 mb-4 border-b pb-2"><i class="fas fa-plus-circle ml-2"></i> إضافة درس جديد</h2>
            
            <form id="lessonForm" class="space-y-4">
                <input type="hidden" id="lessonId">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">الصف الدراسي</label>
                        <select id="gradeSelect" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500" required>
                            <option value="">اختر الصف...</option>
                            <option value="7">الصف السابع</option>
                            <option value="8">الصف الثامن</option>
                            <option value="9">الصف التاسع</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">رقم/اسم الوحدة</label>
                        <input type="text" id="unitInput" class="w-full border rounded-lg p-2.5" placeholder="مثال: الوحدة الأولى: الجبر" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">عنوان الدرس</label>
                        <input type="text" id="titleInput" class="w-full border rounded-lg p-2.5" placeholder="مثال: الأعداد النسبية" required>
                    </div>
                </div>

                <!-- Word Importer Section -->
                <div class="border-2 border-dashed border-indigo-200 bg-indigo-50/50 rounded-xl p-4 text-center">
                    <label class="block text-sm font-bold text-indigo-700 mb-2"><i class="fas fa-file-word ml-1"></i> استيراد محتوى من ملف Word (.docx)</label>
                    <input type="file" id="wordFile" accept=".docx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
                    <p class="text-xs text-gray-500 mt-1">سيتم استخراج النصوص، الفقرات، الصور والمعادلات الرياضية تلقائياً.</p>
                </div>

                <!-- PDF Attachment -->
                <div>
                    <label class="block text-sm font-medium mb-1"><i class="fas fa-file-pdf text-red-600 ml-1"></i> ملف PDF مرفق (اختياري)</label>
                    <input type="file" id="pdfFile" accept=".pdf" class="w-full border rounded-lg p-2 bg-white text-sm">
                    <span id="pdfStatus" class="text-xs text-gray-500"></span>
                </div>

                <!-- Content Editor -->
                <div>
                    <label class="block text-sm font-medium mb-1">محتوى الدرس (HTML / MathJax)</label>
                    <textarea id="contentInput" rows="8" class="w-full border rounded-lg p-3 font-mono text-sm focus:ring-2 focus:ring-indigo-500" placeholder="محتوى الدرس يظهر هنا تلقائياً عند رفع ملف Word أو يمكنك تعديله يدوياً..." required></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-300 text-gray-700 px-5 py-2 rounded-lg font-medium hover:bg-gray-400">إلغاء التعديل</button>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 shadow"><i class="fas fa-save ml-1"></i> حفظ الدرس وتحديث المنصة</button>
                </div>
            </form>
        </div>

        <!-- Lessons Management Table -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="p-4 bg-gray-100 border-b font-bold text-gray-700 flex justify-between items-center">
                <span><i class="fas fa-list ml-2"></i> الدروس المتاحة حالياً</span>
                <button onclick="exportJSONData()" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded hover:bg-green-700"><i class="fas fa-download ml-1"></i> تحميل ملف البيانات (data.json)</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-xs border-b">
                            <th class="p-3">الصف</th>
                            <th class="p-3">الوحدة</th>
                            <th class="p-3">عنوان الدرس</th>
                            <th class="p-3 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="lessonsTableBody" class="divide-y divide-gray-200 text-sm">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let lessons = JSON.parse(localStorage.getItem('math_lessons')) || [
            {
                id: 1,
                grade: "7",
                unit: "الوحدة الأولى",
                title: "مقدمة في الأعداد النسبية",
                content: "<p>تعريف العدد النسبي: هو كل عدد يمكن كتابته على صورة كسـر $\\frac{a}{b}$ حيث $b \\neq 0$.</p>",
                pdf: ""
            }
        ];

        // Handle Word File Upload & Mammoth.js conversion
        document.getElementById('wordFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                const arrayBuffer = loadEvent.target.result;
                
                mammoth.convertToHtml({arrayBuffer: arrayBuffer}, {
                    transformDocument: mammoth.images.inline(function(element) {
                        return element.read("base64").then(function(imageBuffer) {
                            return {
                                src: "data:" + element.contentType + ";base64," + imageBuffer
                            };
                        });
                    })
                })
                .then(function(result) {
                    let html = result.value;
                    // Basic MathJax syntax correction helper for common Word math symbols
                    html = html.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
                    document.getElementById('contentInput').value = html;
                    showAlert("تم استخراج محتوى ملف Word بنجاح والحفاظ على التنسيقات والصور!", "success");
                })
                .catch(function(err) {
                    alert("حدث خطأ أثناء قراءة ملف Word: " + err.message);
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // Handle PDF attachment
        let currentPdfData = "";
        document.getElementById('pdfFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(upload) {
                    currentPdfData = upload.target.result;
                    document.getElementById('pdfStatus').innerText = "تم إرفاق الملف: " + file.name;
                };
                reader.readAsDataURL(file);
            }
        });

        // Form Submit (Add or Update)
        document.getElementById('lessonForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('lessonId').value;
            const grade = document.getElementById('gradeSelect').value;
            const unit = document.getElementById('unitInput').value;
            const title = document.getElementById('titleInput').value;
            const content = document.getElementById('contentInput').value;

            if (id) {
                // Update
                lessons = lessons.map(l => l.id == id ? { ...l, grade, unit, title, content, pdf: currentPdfData || l.pdf } : l);
                showAlert("تم تحديث الدرس بنجاح!", "success");
            } else {
                // Add new
                const newLesson = {
                    id: Date.now(),
                    grade,
                    unit,
                    title,
                    content,
                    pdf: currentPdfData
                };
                lessons.push(newLesson);
                showAlert("تم إضافة الدرس الجديد بنجاح وإدراجه في المنصة!", "success");
            }

            saveAndRefresh();
            resetForm();
        });

        function saveAndRefresh() {
            localStorage.setItem('math_lessons', JSON.stringify(lessons));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('lessonsTableBody');
            tbody.innerHTML = '';
            if (lessons.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">لا توجد دروس مضافة حالياً.</td></tr>`;
                return;
            }

            lessons.forEach(l => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3"><span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs font-bold">الصف ${l.grade}</span></td>
                        <td class="p-3">${l.unit}</td>
                        <td class="p-3 font-medium">${l.title}</td>
                        <td class="p-3 text-center space-x-2 space-x-reverse">
                            <button onclick="editLesson(${l.id})" class="bg-blue-500 text-white px-3 py-1 rounded text-xs hover:bg-blue-600"><i class="fas fa-edit"></i> تعديل</button>
                            <button onclick="deleteLesson(${l.id})" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600"><i class="fas fa-trash"></i> حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function editLesson(id) {
            const l = lessons.find(item => item.id == id);
            if (!l) return;
            document.getElementById('lessonId').value = l.id;
            document.getElementById('gradeSelect').value = l.grade;
            document.getElementById('unitInput').value = l.unit;
            document.getElementById('titleInput').value = l.title;
            document.getElementById('contentInput').value = l.content;
            currentPdfData = l.pdf || "";
            document.getElementById('pdfStatus').innerText = l.pdf ? "يوجد ملف PDF مرفق مسبقاً" : "";
            document.getElementById('formTitle').innerHTML = `<i class="fas fa-edit ml-2"></i> تعديل الدرس: ${l.title}`;
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteLesson(id) {
            if (confirm("هل أنت متأكد من حذف هذا الدرس نهائياً؟")) {
                lessons = lessons.filter(l => l.id != id);
                saveAndRefresh();
                showAlert("تم حذف الدرس بنجاح.", "success");
            }
        }

        function resetForm() {
            document.getElementById('lessonForm').reset();
            document.getElementById('lessonId').value = '';
            document.getElementById('formTitle').innerHTML = `<i class="fas fa-plus-circle ml-2"></i> إضافة درس جديد`;
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('pdfStatus').innerText = '';
            currentPdfData = "";
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        function exportJSONData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lessons, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "data.json");
            dlAnchorElem.click();
        }

        renderTable();
    </script>
</body>
</html>
